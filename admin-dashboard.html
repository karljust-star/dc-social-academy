<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - DC Social Academy</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { display: flex; height: 100vh; background: #f7f5ef; overflow: hidden; }
    .sidebar { width: 280px; background: #171717; color: white; display: flex; flex-direction: column; justify-content: space-between; padding: 25px 15px; }
    .logo { color: #d5a22b; font-size: 32px; font-weight: 900; letter-spacing: -2px; margin-bottom: 2px; }
    .logo-sub { font-size: 12px; color: #aaa; margin-bottom: 20px; }
    .nav-btn { background: #222; color: #d5a22b; border: 1px solid #d5a22b; padding: 12px 15px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 10px; font-size: 14px; display: block; text-decoration: none; }
    .nav-btn.active { background: #d5a22b; color: black; }
    .logout-btn { background: transparent; color: #ff6b6b; border: 1px solid #ff6b6b; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; cursor: pointer; }
    .main-container { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    .header { background: white; padding: 20px 40px; border-bottom: 1px solid #e1e4e8; display: flex; justify-content: space-between; align-items: center; }
    .content-body { padding: 30px 40px; display: flex; flex-direction: column; gap: 20px; max-width: 1200px; }
    .card { background: white; padding: 25px; border-radius: 12px; border: 1px solid #e1e4e8; }
    .form-group { display: flex; gap: 15px; margin-bottom: 15px; }
    .form-field { flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .form-field input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .action-btn { background: #d5a22b; color: black; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { background: #faf9f6; padding: 12px; border-bottom: 1px solid #ddd; }
    td { padding: 12px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="logo">DC</div>
            <div class="logo-sub">SOCIAL ACADEMY</div>
            <a href="admin-dashboard" class="nav-btn active">Panel</a>
            <a href="code" class="nav-btn">CODE</a>
        </div>
        <div class="logout-btn" onclick="logout()">Logout</div>
    </div>

    <div class="main-container">
        <div class="header"><h1>Admin Control Center</h1></div>
        <div class="content-body">
            <div class="card">
                <h3>Mag-generate ng Bagong Code & PIN</h3>
                <div class="form-group">
                    <div class="form-field"><input type="text" id="newCode" placeholder="Access Code"></div>
                    <div class="form-field"><input type="text" id="newPin" placeholder="PIN"></div>
                </div>
                <button class="action-btn" onclick="saveCode()">I-save ang Code at PIN</button>
            </div>
            <div class="card">
                <h3>Listahan ng mga Naka-register na Estudyante</h3>
                <table>
                    <thead>
                        <tr><th>Pangalan</th><th>Username</th><th>Password/PIN</th><th>Email</th><th>CP Number</th><th>Code Ginamit</th></tr>
                    </thead>
                    <tbody id="usersTableBody"><tr><td colspan="6">Naglo-load...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const DB_URL = "https://dc-social-academy-default-rtdb.firebaseio.com/";

    window.onload = function() {
        let user = JSON.parse(localStorage.getItem('current_user'));
        if(!user || user.role !== 'admin') {
            window.location.href = 'index';
            return;
        }
        loadUsers();
    }

    function logout() {
        localStorage.removeItem('current_user');
        window.location.href = 'index';
    }

    async function saveCode() {
        let code = document.getElementById('newCode').value.trim();
        let pin = document.getElementById('newPin').value.trim();
        if(!code || !pin) { alert('Punan ang Code at PIN!'); return; }

        await fetch(`${DB_URL}/codes/${code}.json`, {
            method: 'PUT',
            body: JSON.stringify({ code, pin })
        });
        alert('Na-save na sa Cloud Database!');
        document.getElementById('newCode').value = '';
        document.getElementById('newPin').value = '';
    }

    async function loadUsers() {
        let res = await fetch(`${DB_URL}/users.json`);
        let data = await res.json();
        let tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';
        if(!data) { tbody.innerHTML = '<tr><td colspan="6">Wala pang estudyante.</td></tr>'; return; }

        Object.keys(data).forEach(k => {
            let u = data[k];
            tbody.innerHTML += `<tr><td>${u.name}</td><td>${u.username}</td><td>${u.password}</td><td>${u.email}</td><td>${u.phone}</td><td><strong>${u.codeUsed}</strong></td></tr>`;
        });
    }
</script>
</body>
</html>
