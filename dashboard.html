<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC Social Academy Dashboard</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f7f5ef; color: #171717; }
    .sidebar { position: fixed; left: 0; top: 0; width: 285px; height: 100vh; background: #08090b; color: white; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; z-index: 100; }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo-dc { color: #d5a22b; font-size: 58px; font-weight: 900; letter-spacing: -5px; }
    .logo-name { font-size: 20px; font-weight: bold; margin-top: -5px; }
    .logo-name span { color: #d5a22b; }
    .menu { display: flex; flex-direction: column; gap: 10px; }
    .menu button { background: none; border: none; width: 100%; text-align: left; color: white; padding: 15px 18px; border-radius: 12px; font-size: 16px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
    .menu button:hover { background: #1d1a13; }
    .menu button.active { background: linear-gradient(135deg, #a9760d, #dfae37); }
    .main { margin-left: 285px; min-height: 100vh; padding: 35px 50px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 45px; }
    .lessons { max-width: 1100px; margin: auto; }
    .lesson { background: white; border-radius: 17px; padding: 23px 27px; margin-bottom: 16px; display: flex; align-items: center; gap: 22px; border: 1px solid #eee; box-shadow: 0 5px 18px rgba(0,0,0,0.06); cursor: pointer; }
    .admin-only { display: none; }
    .admin-panel-container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 18px rgba(0,0,0,0.06); }
    .code-generator-box { background: #f9f9f9; padding: 20px; border-radius: 10px; border: 1px solid #e0e0e0; margin-bottom: 25px; }
    .code-generator-box input { padding: 12px; margin-right: 10px; border: 1px solid #ccc; border-radius: 6px; width: 250px; margin-bottom: 10px; }
    .code-generator-box button { padding: 12px 20px; background: #b58418; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #b58418; color: white; }
</style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="logo">
                <div class="logo-dc">DC</div>
                <div class="logo-name">SOCIAL <span>ACADEMY</span></div>
            </div>
            <div class="menu">
                <button onclick="showStudentView()" id="menu-home" class="active">🏠 Home</button>
                <button onclick="showAdminView()" id="admin-menu" class="admin-only">⚙️ Manage Students</button>
            </div>
            <div style="height: 1px; background: #303030; margin: 25px 0;"></div>
            <div class="menu">
                <button onclick="logoutUser()">➔ Logout</button>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <h1>DC SOCIAL ACADEMY</h1>
            <div>
                <b id="display-name">Academy User</b><br>
                <span id="display-role" style="color: #b58418; font-size: 13px;">Academy Partner</span>
            </div>
        </div>

        <!-- HOME VIEW -->
        <div id="student-dashboard-view">
            <h2>Welcome back! 👋</h2>
            <div class="lessons" style="margin-top: 20px;">
                <div class="lesson" onclick="window.location.href='ads.html'">
                    <h3>📢 HOW TO CREATE ADS</h3>
                    <p>Learn how to create effective advertisements.</p>
                </div>
            </div>
        </div>

        <!-- ADMIN VIEW -->
        <div id="admin-dashboard-view" class="admin-only">
            <div class="admin-panel-container">
                <h2>Admin Control Center</h2>
                <div class="code-generator-box" style="margin-top: 15px;">
                    <h3>Mag-generate ng Bagong Code & PIN</h3>
                    <input type="text" id="gen-code" placeholder="10-Char Code"><br>
                    <input type="text" id="gen-pin" placeholder="10-Char PIN"><br>
                    <button onclick="generateNewAccessCode()">I-save ang Code at PIN</button>
                </div>
                <h3>Listahan ng mga Estudyante</h3>
                <table>
                    <thead><tr><th>Pangalan</th><th>Username</th><th>Email</th><th>CP</th><th>Code</th></tr></thead>
                    <tbody id="admin-student-list"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    window.onload = function() {
        const currentUser = JSON.parse(localStorage.getItem('current_user'));
        const isAdmin = localStorage.getItem('current_admin');

        if(isAdmin) {
            document.getElementById('admin-menu').style.display = 'flex';
            document.getElementById('display-name').innerText = "Administrator";
            document.getElementById('display-role').innerText = "System Admin";
        } else if(currentUser) {
            document.getElementById('display-name').innerText = currentUser.name;
            document.getElementById('display-role').innerText = "Academy Partner";
        } else {
            window.location.href = 'index.html';
        }
    }

    function showStudentView() {
        document.getElementById('student-dashboard-view').style.display = 'block';
        document.getElementById('admin-dashboard-view').style.display = 'none';
        document.getElementById('menu-home').classList.add('active');
        document.getElementById('admin-menu').classList.remove('active');
    }

    function showAdminView() {
        document.getElementById('student-dashboard-view').style.display = 'none';
        document.getElementById('admin-dashboard-view').style.display = 'block';
        document.getElementById('admin-menu').classList.add('active');
        document.getElementById('menu-home').classList.remove('active');
        loadAdminStudents();
    }

    function generateNewAccessCode() {
        const code = document.getElementById('gen-code').value.trim();
        const pin = document.getElementById('gen-pin').value.trim();
        if(!code || !pin) { alert("Pakisagutan ang parehong Code at PIN!"); return; }

        let codes = JSON.parse(localStorage.getItem('generated_codes') || '[]');
        if(codes.some(item => item.code === code)) { alert("Umiiral na ang code na ito!"); return; }

        codes.push({ code, pin });
        localStorage.setItem('generated_codes', JSON.stringify(codes));
        alert("Tagumpay! Na-save na ang Code at PIN.");
        document.getElementById('gen-code').value = '';
        document.getElementById('gen-pin').value = '';
    }

    function loadAdminStudents() {
        const users = JSON.parse(localStorage.getItem('academy_users') || '[]');
        const tbody = document.getElementById('admin-student-list');
        tbody.innerHTML = '';
        if(users.length === 0) {
            tbody.innerHTML = <tr><td colspan="5" style="text-align: center; color: #777;">Wala pang estudyanteng nag-register.</td></tr>;
            return;
        }
        users.forEach(u => {
            tbody.innerHTML += <tr><td><b>${u.name}</b></td><td>${u.username}</td><td>${u.email}</td><td>${u.cp}</td><td><b>${u.codeUsed}</b></td></tr>;
        });
    }

    function logoutUser() {
        localStorage.removeItem('current_user');
        localStorage.removeItem('current_admin');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
