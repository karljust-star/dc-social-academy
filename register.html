<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC Social Academy - Register</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f7f5ef; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 30px; }
    .register-box { background: white; padding: 40px; border-radius: 16px; width: 550px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid #e1e4e8; }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo-dc { color: #d5a22b; font-size: 45px; font-weight: 900; letter-spacing: -3px; }
    .logo-name { font-size: 16px; font-weight: bold; color: #171717; }
    .logo-name span { color: #d5a22b; }
    
    h2 { font-size: 22px; color: #171717; margin-bottom: 5px; text-align: center; }
    p.subtitle { font-size: 13px; color: #777; text-align: center; margin-bottom: 25px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .full-width { grid-column: span 2; }
    
    .input-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .input-group label { font-size: 12px; font-weight: bold; color: #444; }
    .input-group input { padding: 10px 12px; background: #faf9f6; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none; }
    .input-group input:focus { border-color: #d5a22b; background: white; }
    
    .btn { width: 100%; padding: 12px; background: #d5a22b; border: none; border-radius: 8px; color: black; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .btn:hover { background: #c29122; }
    
    .back-link { text-align: center; margin-top: 15px; font-size: 13px; color: #666; }
    .back-link a { color: #d5a22b; text-decoration: none; font-weight: bold; cursor: pointer; }
    .back-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

    <div class="register-box">
        <div class="logo">
            <div class="logo-dc">DC</div>
            <div class="logo-name">SOCIAL <span>ACADEMY</span></div>
        </div>
        <h2>Create Student Account</h2>
        <p class="subtitle">I-enter ang iyong mga detalye kasama ang Code at PIN mula sa Admin.</p>
        
        <div class="form-grid">
            <div class="input-group">
                <label>First Name</label>
                <input type="text" id="reg-fname" placeholder="First name">
            </div>
            <div class="input-group">
                <label>Middle Initial</label>
                <input type="text" id="reg-mname" placeholder="M.I.">
            </div>
            <div class="input-group full-width">
                <label>Last Name</label>
                <input type="text" id="reg-lname" placeholder="Last name">
            </div>
            <div class="input-group">
                <label>Birthday</label>
                <input type="date" id="reg-bday">
            </div>
            <div class="input-group">
                <label>CP Number</label>
                <input type="text" id="reg-cp" placeholder="09XXXXXXXXX">
            </div>
            <div class="input-group full-width">
                <label>Email Address</label>
                <input type="email" id="reg-email" placeholder="example@email.com">
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="reg-username" placeholder="Create username">
            </div>
            <div class="input-group">
                <label>Password / PIN</label>
                <input type="password" id="reg-password" placeholder="Create password">
            </div>
            <div class="input-group full-width">
                <label>Retype Password / PIN</label>
                <input type="password" id="reg-retype" placeholder="Retype password">
            </div>
            <div class="input-group">
                <label>Access Code (Galing kay Admin)</label>
                <input type="text" id="reg-code" placeholder="Enter code">
            </div>
            <div class="input-group">
                <label>PIN (Galing kay Admin)</label>
                <input type="text" id="reg-pin" placeholder="Enter PIN">
            </div>
        </div>

        <button class="btn" onclick="registerUser()">REGISTER ACCOUNT</button>
        
        <div class="back-link">
            May account na ba? <a onclick="goToLogin()">Mag-login dito</a>
        </div>
    </div>

<script>
    function goToLogin() {
        window.location.href = 'index.html';
    }

    function registerUser() {
        const fname = document.getElementById('reg-fname').value.trim();
        const mname = document.getElementById('reg-mname').value.trim();
        const lname = document.getElementById('reg-lname').value.trim();
        const bday = document.getElementById('reg-bday').value.trim();
        const cp = document.getElementById('reg-cp').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const username = document.getElementById('reg-username').value.trim();
        const password = document.getElementById('reg-password').value.trim();
        const retype = document.getElementById('reg-retype').value.trim();
        const code = document.getElementById('reg-code').value.trim();
        const pin = document.getElementById('reg-pin').value.trim();

        if(!fname || !lname || !email || !username || !password || !code || !pin) {
            alert("Pakisagutan ang lahat ng mahalagang impormasyon!");
            return;
        }

        if(password !== retype) {
            alert("Hindi magkatugma ang password at retype password!");
            return;
        }

        let generatedCodes = JSON.parse(localStorage.getItem('generated_codes') || '[]');
        let validCodeObj = generatedCodes.find(item => item.code === code && item.pin === pin);

        if(!validCodeObj) {
            alert("Mali o hindi rehistradong Access Code at PIN mula sa Admin!");
            return;
        }

        let data = JSON.parse(localStorage.getItem('academy_users') || '{"users":[]}');
        let usersList = Array.isArray(data) ? data : (data.users || []);

        if(usersList.some(u => u.codeUsed === code)) {
            alert("Ang Access Code na ito ay nagamit na ng ibang account!");
            return;
        }

        let fullName = fname + (mname ? " " + mname + ". " : " ") + lname;

        let newUser = {
            name: fullName,
            username: username,
            pin: password,
            email: email,
            cp: cp,
            bday: bday,
            codeUsed: code
        };

        usersList.push(newUser);
        localStorage.setItem('academy_users', JSON.stringify({ users: usersList }));

        alert("Tagumpay ang paggawa ng account! Maaari ka nang mag-log in.");
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
