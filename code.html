<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Codes - DC Social Academy</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { display: flex; height: 100vh; background: #f7f5ef; overflow: hidden; }
    .sidebar { width: 280px; background: #171717; color: white; display: flex; flex-direction: column; justify-content: space-between; padding: 25px 15px; }
    .logo { color: #d5a22b; font-size: 32px; font-weight: 900; letter-spacing: -2px; margin-bottom: 2px; }
    .logo-sub { font-size: 12px; color: #aaa; margin-bottom: 20px; }
    .nav-btn { background: #222; color: #d5a22b; border: 1px solid #d5a22b; padding: 12px 15px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 10px; font-size: 14px; display: block; text-decoration: none; }
    .nav-btn.active { background: #d5a22b; color: black; }
    .logout-btn { background: transparent; color: #ff6b6b; border: 1px solid #ff6b6b; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; cursor: pointer; }
    .main-container { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    .header { background: white; padding: 20px 40px; border-bottom: 1px solid #e1e4e8; }
    .content-body { padding: 30px 40px; max-width: 1200px; }
    .card { background: white; padding: 25px; border-radius: 12px; border: 1px solid #e1e4e8; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th { background: #faf9f6; padding: 12px; border-bottom: 1px solid #ddd; }
    td { padding: 12px; border-bottom: 1px solid #eee; }
    .status-badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .status-used { background: #e2f0d9; color: #385723; }
    .status-unused { background: #fce4d6; color: #c65911; }
</style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="logo">DC</div>
            <div class="logo-sub">SOCIAL ACADEMY</div>
            <a href="admin-dashboard" class="nav-btn">Panel</a>
            <a href="code" class="nav-btn active">CODE</a>
        </div>
        <div class="logout-btn" onclick="logout()">Logout</div>
    </div>

    <div class="main-container">
        <div class="header"><h1>Listahan ng mga Access Code at PIN</h1></div>
        <div class="content-body">
            <div class="card">
                <table>
                    <thead><tr><th>Access Code</th><th>PIN</th><th>Status</th></tr></thead>
                    <tbody id="codesTableBody"><tr><td colspan="3">Naglo-load...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    const DB_URL = "https://dc-social-academy-default-rtdb.firebaseio.com/";

    function logout() {
        localStorage.removeItem('current_user');
        window.location.href = 'index';
    }

    window.onload = async function() {
        let [cRes, uRes] = await Promise.all([fetch(`${DB_URL}/codes.json`), fetch(`${DB_URL}/users.json`)]);
        let codes = await cRes.json() || {};
        let users = await uRes.json() || {};
        let used = Object.values(users).map(u => u.codeUsed);

        let tbody = document.getElementById('codesTableBody');
        tbody.innerHTML = '';
        Object.keys(codes).forEach(k => {
            let item = codes[k];
            let isUsed = used.includes(item.code);
            tbody.innerHTML += `<tr><td><strong>${item.code}</strong></td><td>${item.pin}</td><td><span class="status-badge ${isUsed ? 'status-used' : 'status-unused'}">${isUsed ? 'Used' : 'Available'}</span></td></tr>`;
        });
    }
</script>
</body>
</html>
