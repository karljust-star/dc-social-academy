<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Social Academy - Login & Register</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            color: #171717;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
        }
        .left-banner {
            width: 45%;
            background: #171717;
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .left-banner h1 { font-size: 32px; margin-bottom: 15px; }
        .left-banner span { color: #c99224; }
        .left-banner p { color: #aaa; font-size: 15px; line-height: 1.5; }
        
        .right-form {
            width: 55%;
            padding: 40px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #777;
        }
        .tab-btn.active {
            color: #c99224;
            border-bottom: 3px solid #c99224;
        }
        .form-section { display: none; }
        .form-section.active { display: block; }
        
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #c99224;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .submit-btn:hover { background: #a97616; }
        .error-msg { color: red; font-size: 13px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- LEFT BANNER -->
    <div class="left-banner">
        <h1>Welcome to <br><span>DC Social Academy</span></h1>
        <p>Master modern social media creation, portfolio building, AI visuals, and viral distribution strategies. Lumikha ng iyong account gamit ang ibinigay na Code at PIN.</p>
    </div>

    <!-- RIGHT FORM CONTAINER -->
    <div class="right-form">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('register')">Create Account</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-section" class="form-section active">
            <h2>Log In</h2>
            <div id="login-error" class="error-msg"></div>
            <form onsubmit="handleLogin(event)">
                <label>Username</label>
                <input type="text" id="login-user" required>
                
                <label>Password</label>
                <input type="password" id="login-pass" required>
                
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-section" class="form-section">
            <h2>Create Account</h2>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Kinakailangan ang Code at PIN na mula sa aming admin para makagawa ng account.</p>
            <div id="reg-error" class="error-msg"></div>
            
            <form onsubmit="handleRegister(event)">
                <label>Full Name</label>
                <input type="text" id="reg-name" required>

                <label>Birthday</label>
                <input type="date" id="reg-bday" required>

                <label>Gender</label>
                <select id="reg-gender" required>
                    <option value="">Piliin ang Kasarian</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>

                <label>Email Address</label>
                <input type="email" id="reg-email" required>

                <label>CP Number</label>
                <input type="text" id="reg-cp" required>

                <label>Username</label>
                <input type="text" id="reg-username" required>

                <label>Password</label>
                <input type="password" id="reg-password" required>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

                <label style="color: #c99224;">Exclusive Access Code</label>
                <input type="text" id="reg-code" placeholder="Halimbawa: DCACADEMY2026" required>

                <label style="color: #c99224;">Access PIN</label>
                <input type="password" id="reg-pin" placeholder="4-digit PIN" required>

                <button type="submit" class="submit-btn">Register & Access Academy</button>
            </form>
        </div>
    </div>
</div>

<script>
    // MGA VALID CODES AT PINS NA IKAW ANG GUMAWA (Pwede kang magdagdag dito)
    // Kapag nagamit na ang isang code, mada-markahan itong 'used' sa browser.
    const validAccessCodes = [
        { code: "DC2026", pin: "1234" },
        { code: "VIPSTUDENT", pin: "5678" },
        { code: "SOCIALPRO", pin: "9988" }
    ];

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
        
        if(tab === 'login') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('login-section').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('register-section').classList.add('active');
        }
    }

    function handleRegister(e) {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const bday = document.getElementById('reg-bday').value;
        const gender = document.getElementById('reg-gender').value;
        const email = document.getElementById('reg-email').value;
        const cp = document.getElementById('reg-cp').value;
        const username = document.getElementById('reg-username').value;
        const password = document.getElementById('reg-password').value;
        const inputCode = document.getElementById('reg-code').value.trim();
        const inputPin = document.getElementById('reg-pin').value.trim();
        const errorDiv = document.getElementById('reg-error');

        // Check kung nagamit na ang code na ito sa LocalStorage
        let usedCodes = JSON.parse(localStorage.getItem('used_codes') || '[]');
        if(usedCodes.includes(inputCode)) {
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Ang Code at PIN na ito ay nagamit na ng ibang tao!";
            return;
        }

        // Check kung tama ang Code at PIN sa listahan
        const isValid = validAccessCodes.find(item => item.code === inputCode && item.pin === inputPin);
        if(!isValid) {
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Mali ang Access Code o PIN. Mangyaring suriin ito o humingi sa admin.";
            return;
        }

        // I-save ang user account sa LocalStorage
        let users = JSON.parse(localStorage.getItem('academy_users') || '[]');
        
        // Check kung may kaparehong username na
        if(users.some(u => u.username === username)) {
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Ang username na ito ay nagamit na. Pumili ng iba.";
            return;
        }

        users.push({ name, bday, gender, email, cp, username, password });
        localStorage.setItem('academy_users', JSON.stringify(users));

        // Markahan ang code bilang nagamit na para hindi na magamit ulit
        usedCodes.push(inputCode);
        localStorage.setItem('used_codes', JSON.stringify(usedCodes));

        alert("Tagumpay ang paggawa ng account! Maaari ka na ngayong mag-log in.");
        switchTab('login');
    }

    function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('login-user').value;
        const pass = document.getElementById('login-pass').value;
        const errorDiv = document.getElementById('login-error');

        let users = JSON.parse(localStorage.getItem('academy_users') || '[]');
        const foundUser = users.find(u => u.username === user && u.password === pass);

        if(foundUser) {
            // I-save kung sino ang naka-login ngayon
            localStorage.setItem('current_user', JSON.stringify(foundUser));
            // Redirect papunta sa dashboard mo (siguraduhing 'dashboard.html' ang pangalan ng file ng dashboard mo)
            window.location.href = "dashboard.html";
        } else {
            errorDiv.style.display = 'block';
            errorDiv.innerText = "Mali ang username o password.";
        }
    }
</script>

</body>
</html>
