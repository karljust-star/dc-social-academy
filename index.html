<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC Social Academy - Login</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f7f5ef; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { background: white; padding: 40px; border-radius: 12px; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
    .logo { color: #d5a22b; font-size: 32px; font-weight: 900; margin-bottom: 5px; letter-spacing: -2px; }
    .logo-sub { font-size: 12px; color: #777; margin-bottom: 25px; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #d5a22b; color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-bottom: 10px; }
    button:hover { background: #c29122; }
    .toggle-text { font-size: 13px; color: #555; margin-top: 15px; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
    <div class="logo">DC</div>
    <div class="logo-sub">SOCIAL ACADEMY</div>

    <!-- Login Form -->
    <div id="loginFormSection">
        <h2 id="formTitle" style="margin-bottom: 20px; font-size: 20px; color: #171717;">Mag-login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password / PIN">
        <button onclick="handleLogin()">Mag-login</button>
        <div class="toggle-text" onclick="toggleMode('register')">Wala pang account? Mag-register dito</div>
    </div>

    <!-- Register Form -->
    <div id="registerFormSection" style="display: none;">
        <h2 style="margin-bottom: 20px; font-size: 20px; color: #171717;">Mag-register</h2>
        <input type="text" id="regName" placeholder="Buong Pangalan">
        <input type="text" id="regEmail" placeholder="Email Address">
        <input type="text" id="regPhone" placeholder="CP Number">
        <input type="text" id="regUsername" placeholder="Bagong Username">
        <input type="password" id="regPassword" placeholder="Bagong Password / PIN">
        <input type="text" id="regCode" placeholder="Access Code na ibinigay ng Admin">
        <button onclick="handleRegister()">I-submit ang Registration</button>
        <div class="toggle-text" onclick="toggleMode('login')">May account na? Mag-login</div>
    </div>
</div>

<script>
    const DB_URL = "https://dc-social-academy-default-rtdb.firebaseio.com/";

    function toggleMode(mode) {
        if(mode === 'register') {
            document.getElementById('loginFormSection').style.display = 'none';
            document.getElementById('registerFormSection').style.display = 'block';
        } else {
            document.getElementById('registerFormSection').style.display = 'none';
            document.getElementById('loginFormSection').style.display = 'block';
        }
    }

    async function handleLogin() {
        let u = document.getElementById('username').value.trim();
        let p = document.getElementById('password').value.trim();

        if(!u || !p) {
            alert('Ilagay ang username at password!');
            return;
        }

        // 1. Check kung Admin
        if(u === 'admin' && p === 'admin123') {
            localStorage.setItem('current_user', JSON.stringify({ role: 'admin', username: 'admin' }));
            window.location.href = 'admin-dashboard';
            return;
        }

        // 2. Check kung Estudyante sa Firebase
        try {
            let res = await fetch(`${DB_URL}/users.json`);
            let data = await res.json();
            
            if(!data) {
                alert('Mali ang username o password, o wala pang registered account.');
                return;
            }

            let foundUser = null;
            Object.keys(data).forEach(key => {
                let usr = data[key];
                if(usr.username === u && (usr.password === p || usr.pin === p)) {
                    foundUser = usr;
                }
            });

            if(foundUser) {
                localStorage.setItem('current_user', JSON.stringify({ role: 'student', ...foundUser }));
                window.location.href = 'student-dashboard';
            } else {
                alert('Mali ang username o password!');
            }
        } catch(e) {
            alert('Error sa pagkonekta sa database.');
        }
    }

    async function handleRegister() {
        let name = document.getElementById('regName').value.trim();
        let email = document.getElementById('regEmail').value.trim();
        let phone = document.getElementById('regPhone').value.trim();
        let username = document.getElementById('regUsername').value.trim();
        let password = document.getElementById('regPassword').value.trim();
        let code = document.getElementById('regCode').value.trim();

        if(!name || !username || !password || !code) {
            alert('Punan ang mga kinakailangang impormasyon at Access Code!');
            return;
        }

        try {
            // Verify kung valid ang Access Code na ginawa ng Admin
            let codeRes = await fetch(`${DB_URL}/codes/${code}.json`);
            let codeData = await codeRes.json();

            if(!codeData) {
                alert('Ang Access Code na ito ay invalid o wala sa listahan ng Admin!');
                return;
            }

            // I-save ang estudyante sa Firebase
            let newUser = { name, email, phone, username, password, codeUsed: code };
            await fetch(`${DB_URL}/users.json`, {
                method: 'POST',
                body: JSON.stringify(newUser)
            });

            alert('Tagumpay ang pag-register! Maaari ka nang mag-login.');
            toggleMode('login');
        } catch(e) {
            alert('Error sa pag-register: ' + e.message);
        }
    }
</script>
</body>
</html>
